<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; }
    .fade { opacity: 0; animation: fade 0.8s ease-out forwards; }
    .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.9s; } .d3 { animation-delay: 1.5s; }
    .d4 { animation-delay: 2.0s; } .d5 { animation-delay: 2.3s; } .d6 { animation-delay: 2.6s; }
    .d7 { animation-delay: 2.9s; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .trace { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.2s 0.6s ease-in-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .orbit { transform-origin: 1010px 196px; animation: spin 60s linear infinite; }
    .orbit2 { transform-origin: 1010px 196px; animation: spin 90s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
    .p2 { animation-delay: 0.5s; } .p3 { animation-delay: 1.0s; } .p4 { animation-delay: 1.5s; }
    .p5 { animation-delay: 2.0s; } .p6 { animation-delay: 2.4s; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.6); opacity: 0.35; } }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1a2330"/>
    </pattern>
    <radialGradient id="glow" cx="1010" cy="196" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c88ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c88ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="400" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#0b0f14"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>

    <!-- a measurement trace running under the name -->
    <path class="trace" d="M0 344 L90 338 L160 346 L230 326 L300 334 L370 312 L440 324 L510 300 L580 310 L650 288 L720 300 L790 276"
          fill="none" stroke="#62cda0" stroke-opacity="0.35" stroke-width="2"/>

    <!-- left: who -->
    <text class="mono fade d1" x="64" y="84" font-size="18" fill="#8291a0">~/dimhold $ whoami<tspan class="cursor" fill="#62cda0"> ▍</tspan></text>
    <text class="sans fade d2" x="62" y="152" font-size="58" font-weight="600" fill="#eef2f6">Dmitriy Semenkevich</text>
    <text class="sans fade d3" x="64" y="196" font-size="24" fill="#eef2f6">Software architect. I measure what software and AI really do.</text>

    <!-- chips -->
    <g class="sans" font-size="16">
      <g class="fade d4"><rect x="64" y="226" width="196" height="36" rx="18" fill="#10161e"/><text x="162" y="250" text-anchor="middle" fill="#e8a860">15+ years in production</text></g>
      <g class="fade d5"><rect x="272" y="226" width="186" height="36" rx="18" fill="#10161e"/><text x="365" y="250" text-anchor="middle" fill="#7c88ff">co-founder of Adlega</text></g>
      <g class="fade d6"><rect x="470" y="226" width="160" height="36" rx="18" fill="#10161e"/><text x="550" y="250" text-anchor="middle" fill="#62cda0">16 open studies</text></g>
      <g class="fade d7"><rect x="642" y="218" width="136" height="52" rx="18" fill="#10161e"/><text x="710" y="240" text-anchor="middle" font-size="15" fill="#8291a0">Minsk · Warsaw</text><text x="710" y="260" text-anchor="middle" font-size="15" fill="#8291a0">GE · EU · USA</text></g>
    </g>

    <!-- right: what I measure, as an orbit -->
    <g>
      <circle cx="1010" cy="196" r="70" fill="none" stroke="#1d2733" stroke-width="1"/>
      <circle cx="1010" cy="196" r="120" fill="none" stroke="#1d2733" stroke-width="1" stroke-dasharray="3 6"/>
      <circle cx="1010" cy="196" r="170" fill="none" stroke="#1d2733" stroke-width="1"/>
      <g class="orbit">
        <line x1="1010" y1="196" x2="1180" y2="196" stroke="#7c88ff" stroke-opacity="0.25"/>
      </g>
      <circle cx="1010" cy="196" r="30" fill="#10161e"/>
      <text class="mono" x="1010" y="202" font-size="16" text-anchor="middle" fill="#eef2f6">n=?</text>

      <g class="sans" font-size="15">
        <circle class="pulse" cx="1010" cy="76" r="5" fill="#e86c6c"/>
        <text x="1010" y="58" text-anchor="middle" fill="#eef2f6">AI agents</text>

        <circle class="pulse p2" cx="1114" cy="136" r="5" fill="#e8a860"/>
        <text x="1126" y="128" fill="#eef2f6">AI in finance</text>

        <circle class="pulse p3" cx="1114" cy="256" r="5" fill="#62cda0"/>
        <text x="1126" y="272" fill="#eef2f6">npm supply chain</text>

        <circle class="pulse p4" cx="1010" cy="316" r="5" fill="#7c88ff"/>
        <text x="1010" y="344" text-anchor="middle" fill="#eef2f6">Postgres</text>

        <circle class="pulse p5" cx="906" cy="256" r="5" fill="#e8a860"/>
        <text x="906" y="282" text-anchor="middle" fill="#eef2f6">statistics</text>

        <circle class="pulse p6" cx="906" cy="136" r="5" fill="#62cda0"/>
        <text x="894" y="128" text-anchor="end" fill="#eef2f6">Belarusian culture</text>
      </g>
    </g>

    <!-- footer signature, per assets/brand.py -->
    <text class="mono" x="64" y="376" font-size="14" fill="#8291a0">github.com/dimhold · dimhold.by</text>
    <text class="sans" x="1216" y="376" font-size="14" text-anchor="end" fill="#7c88ff">made with ♥ by dimhold</text>
  </g>
</svg>
